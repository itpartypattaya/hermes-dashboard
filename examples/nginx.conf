# Reverse-proxy snippet: the static pages AND the settings server behind ONE
# basic-auth realm. The settings server binds to 127.0.0.1 only and must never
# be exposed without this (or an equivalent) authentication layer.
location /dashboard/ {
    auth_basic           "Agent dashboard - private";
    auth_basic_user_file /etc/nginx/.htpasswd-dashboard;   # htpasswd -B, outside the webroot
    index index.html;
    try_files $uri $uri/ =404;
}
location /dashboard/settings/ {
    auth_basic           "Agent dashboard - private";
    auth_basic_user_file /etc/nginx/.htpasswd-dashboard;
    proxy_pass http://127.0.0.1:8648/;      # trailing slash strips the prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;                # billing CSV upload
}
